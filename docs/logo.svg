<svg xmlns="http://www.w3.org/2000/svg" width="432" height="432" viewBox="0 0 108 108">
  <!-- Bento Home のロゴ（案 G）。端末に見えるのは中央の 72×72。外形は端末が切り抜く -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3a52a0"/><stop offset="1" stop-color="#101833"/>
    </linearGradient>
    <linearGradient id="cell" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e6e1d4"/>
    </linearGradient>
    <linearGradient id="item" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f4690"/><stop offset="1" stop-color="#16214a"/>
    </linearGradient>
    <radialGradient id="ume" cx="0.38" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#f6d98c"/><stop offset="1" stop-color="#b3812c"/>
    </radialGradient>
  </defs>
  <rect width="108" height="108" fill="url(#bg)"/>
  <rect x="30" y="30" width="22" height="48" rx="5" fill="url(#cell)"/>
  <rect x="56" y="30" width="22" height="22" rx="5" fill="url(#cell)"/>
  <rect x="56" y="56" width="22" height="22" rx="5" fill="url(#cell)"/>
  <rect x="60" y="34" width="14" height="14" rx="3" fill="url(#item)"/>
  <rect x="60" y="60" width="14" height="14" rx="3" fill="url(#item)"/>
  <circle cx="41" cy="54" r="7.5" fill="url(#ume)"/>
</svg>
